{% load static %}
{% load humanize %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kavin Text | {% block title %}Dashboard{% endblock %}</title>

  <!-- Plugins CSS -->
  <link rel="stylesheet" href="{% static 'assets/vendors/feather/feather.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/vendors/ti-icons/css/themify-icons.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/vendors/css/vendor.bundle.base.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/vendors/font-awesome/css/font-awesome.min.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/vendors/mdi/css/materialdesignicons.min.css' %}" />

  <!-- Select2 plugin CSS -->
  <link rel="stylesheet" href="{% static 'assets/vendors/select2/select2.min-style.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/vendors/select2-bootstrap-theme/select2-bootstrap.min.css' %}" />

  <!-- Main CSS -->
  <link rel="stylesheet" href="{% static 'assets/css/style.css' %}" />
  <link rel="shortcut icon" href="{% static 'assets/images/favicon.png' %}" />
  <style>
    .nav .nav-link.active {
      background-color: #111114 !important;
      color: #ffffff !important;
      font-weight: 600 !important;
      border-radius: 12px !important;
    }

    .nav .nav-link.active .menu-icon,
    .nav .nav-link.active .menu-title {
      color: white !important;
    }

    .sidebar .nav .nav-item .nav-link:hover {
      background-color: #f4f5f8 !important;
      color: #111114 !important;
      border-radius: 12px !important;
    }

    .sidebar .nav .nav-item .nav-link:hover .menu-icon,
    .sidebar .nav .nav-item .nav-link:hover .menu-title {
      color: #111114 !important;
    }

    .bw-card-dark {
      background: linear-gradient(135deg, #111114 0%, #2a2a35 100%);
      color: #ffffff;
      border: none;
      border-radius: 20px;
      box-shadow: 0 15px 30px -10px rgba(17, 17, 20, 0.4);
      transition: transform 0.3s ease;
    }

    .bw-card-dark:hover {
      transform: translateY(-3px);
    }

    .bw-card-light {
      background: #ffffff;
      color: #111114;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 20px;
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.04);
      transition: transform 0.3s ease;
    }

    .bw-card-light:hover {
      transform: translateY(-3px);
    }

    .bw-card-gray {
      background: #f4f5f8;
      color: #111114;
      border: 1px solid rgba(0, 0, 0, 0.02);
      border-radius: 20px;
      transition: transform 0.3s ease;
    }

    .bw-card-gray:hover {
      transform: translateY(-3px);
    }

    .bg-light-custom {
      background-color: #fafbfc;
      min-height: calc(100vh - 60px);
    }

    .card-label-dark {
      color: #9ba1a6;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .card-label-light {
      color: #6c7278;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .icon-wrapper {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .icon-dark {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .icon-light {
      background: rgba(17, 17, 20, 0.04);
      color: #111114;
    }

    .icon-gray {
      background: #ffffff;
      color: #111114;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
    }

    .badge-dark-outline {
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e0e2e5;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 6px;
      display: inline-block;
    }

    .badge-light-outline {
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #4a4d52;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 6px;
      display: inline-block;
    }

    .btn-primary {
      background: linear-gradient(135deg, #111114 0%, #2a2a35 100%) !important;
      border: none !important;
      box-shadow: 0 4px 10px rgba(17, 17, 20, 0.2) !important;
      color: white !important;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #1a1a20 0%, #363644 100%) !important;
      transform: translateY(-1px);
    }

    /* Fix sidebar icons gap when toggled */
    @media (min-width: 992px) {
      .sidebar-icon-only .sidebar .nav .nav-item .nav-link {
        margin: 0 10px !important;
        padding: 0 !important;
        height: 50px !important;
        width: 50px !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
      }

      .sidebar-icon-only .sidebar .nav .nav-item .nav-link .menu-icon {
        margin: 0 !important;
      }
    }
  </style>

  {% block extra_css %}{% endblock %}
</head>

<body>
  <div class="container-scroller">
    <!-- Navbar -->
    <nav class="navbar col-lg-12 col-12 p-0 fixed-top d-flex flex-row">
      <div class="text-center navbar-brand-wrapper d-flex align-items-center justify-content-start">
        <a class="navbar-brand brand-logo me-5" href="{% url 'dashboard' %}">
          <img src="{% static 'assets/images/logo.png' %}" class="me-2" alt="logo" />
          <span style="font-weight: 800; font-size: 22px; letter-spacing: -0.5px; color: #111114;">Kavin<span
              style="color: #9ba1a6; font-weight: 400;">Text</span></span>
        </a>
        <a class="navbar-brand brand-logo-mini" href="{% url 'dashboard' %}">
          <img src="{% static 'assets/images/logo.png' %}" alt="logo" />
        </a>
      </div>

      <div class="navbar-menu-wrapper d-flex align-items-center justify-content-end">
        <button class="navbar-toggler align-self-center" type="button" data-toggle="minimize">
          <span class="icon-menu"></span>
        </button>

        <ul class="navbar-nav navbar-nav-right">
          <li class="nav-item nav-profile dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" id="profileDropdown">
              <img src="{% static 'assets/images/profile.png' %}" alt="profile" />
            </a>
            <div class="dropdown-menu dropdown-menu-right navbar-dropdown" aria-labelledby="profileDropdown">
              <!-- CORRECTION: Implemented secure logout via a POST form -->
              <form id="logout-form" action="{% url 'logout' %}" method="POST" style="display: none;">
                {% csrf_token %}
              </form>
              <a class="dropdown-item" href="#"
                onclick="event.preventDefault(); document.getElementById('logout-form').submit();">
                <i class="ti-power-off text-primary"></i> Logout
              </a>
            </div>
          </li>
        </ul>

        <button class="navbar-toggler navbar-toggler-right d-lg-none align-self-center" type="button"
          data-toggle="offcanvas">
          <span class="icon-menu"></span>
        </button>
      </div>
    </nav>

    <div class="container-fluid page-body-wrapper">
      <!-- Sidebar -->
      <nav class="sidebar sidebar-offcanvas" id="sidebar">
        <ul class="nav">
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
              href="{% url 'dashboard' %}">
              <i class="icon-grid menu-icon"></i>
              <span class="menu-title">Dashboard</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'invoice' %}active{% endif %}"
              href="{% url 'invoice' %}">
              <i class="icon-paper menu-icon"></i>
              <span class="menu-title">Generate Invoice</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'view-invoices' %}active{% endif %}"
              href="{% url 'view-invoices' %}">
              <i class="ti-pencil-alt menu-icon"></i>
              <span class="menu-title">Manage Invoices</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- Main Panel -->
      <div class="main-panel">
        {% block content %}{% endblock %}
      </div>
      <!-- main-panel ends -->
    </div>
    <!-- page-body-wrapper ends -->
  </div>
  <!-- container-scroller -->

  <!-- JS Plugins -->
  <script src="{% static 'assets/vendors/js/vendor.bundle.base.js' %}"></script>
  <script src="{% static 'assets/vendors/chart.js/chart.umd.js' %}"></script>

  <!-- Core JS -->
  <script src="{% static 'assets/js/off-canvas.js' %}"></script>
  <script src="{% static 'assets/js/template.js' %}"></script>
  <script src="{% static 'assets/js/settings.js' %}"></script>
  <script src="{% static 'assets/js/todolist.js' %}"></script>
  <script src="{% static 'assets/js/jquery.cookie.js' %}" type="text/javascript"></script>

  <!-- Logout Logic -->
  <script>
    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = "/index.html";
      });
    }
  </script>

  {% block extra_js %}{% endblock %}
</body>

</html>
